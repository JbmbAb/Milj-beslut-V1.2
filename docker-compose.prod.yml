# Provider-neutral production/staging runtime. GCP/Cloud Run deployment remains
# legacy-only; this compose file uses the canonical Dockerfile targets.

x-app-env: &app-env
  NODE_ENV: production
  PORT: '8080'
  BUILD_SHA: ${BUILD_SHA:?set BUILD_SHA to the deployed git commit}
  DATABASE_URL: ${DATABASE_URL:-postgresql://miljobeslut:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD outside the repository}@db:5432/miljobeslut_prod?sslmode=disable}
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET outside the repository}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET outside the repository}
  LANTMATERIET_BASE_URL: ${LANTMATERIET_BASE_URL:?set LANTMATERIET_BASE_URL outside the repository}
  LANTMATERIET_OPEN_MODE: ${LANTMATERIET_OPEN_MODE:-false}
  LANTMATERIET_CONSUMER_KEY: ${LANTMATERIET_CONSUMER_KEY:-}
  LANTMATERIET_CONSUMER_SECRET: ${LANTMATERIET_CONSUMER_SECRET:-}
  LANTMATERIET_ACCESS_TOKEN: ${LANTMATERIET_ACCESS_TOKEN:-}
  LANTMATERIET_API_KEY: ${LANTMATERIET_API_KEY:-}
  VERTEX_PROJECT_ID: ${VERTEX_PROJECT_ID:?set VERTEX_PROJECT_ID outside the repository}
  GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
  GOOGLE_APPLICATION_CREDENTIALS_JSON: ${GOOGLE_APPLICATION_CREDENTIALS_JSON:-}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  DOCUMENT_STORAGE_ROOT: /app/storage/uploads
  MIMERS_ROOT: /data/mimers
  MIMERS_REQUIRED: '1'
  MIMERS_DURABILITY_MODE: ${MIMERS_DURABILITY_MODE:-best-effort}
  BACKUP_DIR: /app/storage/backups
  IMPORT_ARCHIVE_ROOT: /data/geo_master
  KNOWLEDGE_BASE_ROOT: /data/geo_master/knowledge_base
  START_WORKERS_IN_PROCESS: 'false'

services:
  db-bootstrap:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
      args:
        BUILD_SHA: ${BUILD_SHA:?set BUILD_SHA to the deployed git commit}
    image: miljobeslut-web:${IMAGE_TAG:-latest}
    container_name: miljobeslut-db-bootstrap
    restart: 'no'
    env_file:
      - path: .env.production
        required: false
    environment:
      <<: *app-env
      DB_BOOTSTRAP_CONFIRM: 'yes'
      PROJECT_CONTEXT_BINDING_ISSUER_PRIVATE_KEY_PEM: ''
      LU_EXECUTION_AUTHORITY_PRIVATE_KEY_PEM: ''
      VIEWER_CAPABILITY_ISSUER_PRIVATE_KEY_PEM: ''
      LOCALIZATION_GEOMETRY_SUPERSESSION_ISSUER_PRIVATE_KEY_PEM: ''
    command: ['npm', 'run', 'db:bootstrap']
    depends_on:
      db:
        condition: service_healthy
    networks:
      - prod-net

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
      args:
        BUILD_SHA: ${BUILD_SHA:?set BUILD_SHA to the deployed git commit}
    image: miljobeslut-web:${IMAGE_TAG:-latest}
    container_name: miljobeslut-web
    restart: unless-stopped
    ports:
      - '8080:8080'
    env_file:
      - path: .env.production
        required: false
    environment:
      <<: *app-env
      # Defense-in-depth: the web process must not receive LU issuer private keys even
      # if an operator accidentally places them in .env.production.
      PROJECT_CONTEXT_BINDING_ISSUER_PRIVATE_KEY_PEM: ''
      LU_EXECUTION_AUTHORITY_PRIVATE_KEY_PEM: ''
      VIEWER_CAPABILITY_ISSUER_PRIVATE_KEY_PEM: ''
      LOCALIZATION_GEOMETRY_SUPERSESSION_ISSUER_PRIVATE_KEY_PEM: ''
    volumes:
      - document_uploads:/app/storage/uploads
      - ./backups/prod:/app/storage/backups
      - mimers_cas:/data/mimers
      - ${MASTER_ARCHIVE_HOST_PATH:-./storage/master-archive}:/data/geo_master:ro
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:8080/ready >/dev/null']
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - prod-net

  worker-all:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker-all
      args:
        BUILD_SHA: ${BUILD_SHA:?set BUILD_SHA to the deployed git commit}
    image: miljobeslut-worker-all:${IMAGE_TAG:-latest}
    container_name: miljobeslut-worker-all
    restart: unless-stopped
    env_file:
      - path: .env.production
        required: false
    environment:
      <<: *app-env
      PORT: ''
      SEARCH_WORKER_ENABLED: ${SEARCH_WORKER_ENABLED:-true}
      GDPR_CRON_IN_PROCESS: ${GDPR_CRON_IN_PROCESS:-true}
      LU_PROVISIONING_WORKERS_STRICT: ${LU_PROVISIONING_WORKERS_STRICT:-true}
    command:
      - /bin/sh
      - -lc
      - |
        export PROJECT_CONTEXT_BINDING_ISSUER_PRIVATE_KEY_PEM="$$(cat /run/secrets/project_context_binding_issuer_private_key)"
        export LU_EXECUTION_AUTHORITY_PRIVATE_KEY_PEM="$$(cat /run/secrets/lu_execution_authority_private_key)"
        export VIEWER_CAPABILITY_ISSUER_PRIVATE_KEY_PEM="$$(cat /run/secrets/viewer_capability_issuer_private_key)"
        export LOCALIZATION_GEOMETRY_SUPERSESSION_ISSUER_PRIVATE_KEY_PEM="$$(cat /run/secrets/localization_geometry_supersession_issuer_private_key)"
        exec npm run worker:all
    secrets:
      - project_context_binding_issuer_private_key
      - lu_execution_authority_private_key
      - viewer_capability_issuer_private_key
      - localization_geometry_supersession_issuer_private_key
    volumes:
      - document_uploads:/app/storage/uploads
      - ./backups/prod:/app/storage/backups
      - mimers_cas:/data/mimers
      - ${MASTER_ARCHIVE_HOST_PATH:-./storage/master-archive}:/data/geo_master:ro
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully
    networks:
      - prod-net

  db:
    build:
      context: ./docker/postgres-prod
      dockerfile: Dockerfile
    image: miljobeslut-postgres-prod:15
    container_name: miljobeslut-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: miljobeslut
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD outside the repository}
      POSTGRES_DB: miljobeslut_prod
    ports:
      - '5434:5432'
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
      - ./backups/prod:/backups
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U miljobeslut -d miljobeslut_prod']
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - prod-net

volumes:
  document_uploads:
  mimers_cas:
  pgdata_prod:

secrets:
  project_context_binding_issuer_private_key:
    file: ${PROJECT_CONTEXT_BINDING_ISSUER_PRIVATE_KEY_FILE:?set PROJECT_CONTEXT_BINDING_ISSUER_PRIVATE_KEY_FILE outside the repository}
  lu_execution_authority_private_key:
    file: ${LU_EXECUTION_AUTHORITY_PRIVATE_KEY_FILE:?set LU_EXECUTION_AUTHORITY_PRIVATE_KEY_FILE outside the repository}
  viewer_capability_issuer_private_key:
    file: ${VIEWER_CAPABILITY_ISSUER_PRIVATE_KEY_FILE:?set VIEWER_CAPABILITY_ISSUER_PRIVATE_KEY_FILE outside the repository}
  localization_geometry_supersession_issuer_private_key:
    file: ${LOCALIZATION_GEOMETRY_SUPERSESSION_ISSUER_PRIVATE_KEY_FILE:?set LOCALIZATION_GEOMETRY_SUPERSESSION_ISSUER_PRIVATE_KEY_FILE outside the repository}

networks:
  prod-net:
    driver: bridge
