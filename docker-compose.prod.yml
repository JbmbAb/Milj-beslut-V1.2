version: '3.9'

# Primär prod — egen server (dual-track A). Se docs/ops/local-prod-setup.md

services:
  app:
    # Local/on-prem image. `web` is the server stage (CMD npm start).
    # PORT below overrides the image default and is what server/index.ts binds.
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    image: miljobeslut-portal:latest
    container_name: miljobeslut-app
    restart: unless-stopped
    ports:
      - '8080:3000'
    env_file:
      - .env.production
    # W-U402 (U40-2 punkt 5, ägarbeslut Round 20 alt. C): uttrycklig säkerhetsspärr. Filen får aldrig köras mot den
    # delade/live-PostGIS:en. (a) Ingen databas i filen: DATABASE_URL måste anges uttryckligen; (b) inga in-process-
    # arbetare och inget GDPR-underhåll i denna konfiguration; (c) obligatorisk kvittens: saknad/tom => compose vägrar
    # rendera, fel värde => app-processen vägrar i server/loadEnvFirst.ts innan något når databasen.
    # Värdena här går före env_file (.env.production). Följd: lokal prod kör inte GDPR-underhåll via denna fil.
    environment:
      NODE_ENV: production
      PORT: '3000'
      DATABASE_URL: ${MILJOBESLUT_PROD_DATABASE_URL:?ange MILJOBESLUT_PROD_DATABASE_URL uttryckligen -- aldrig den delade live-databasen (miljobeslut-postgres)}
      MILJOBESLUT_PROD_COMPOSE_ACK: ${MILJOBESLUT_PROD_COMPOSE_ACK:?docker-compose.prod.yml är spärrad (U40-2) -- kvittera med MILJOBESLUT_PROD_COMPOSE_ACK=not-the-shared-live-database}
      BACKUP_DIR: /app/storage/backups
      SEARCH_WORKER_ENABLED: 'true'
      GDPR_CRON_IN_PROCESS: 'false'
      START_WORKERS_IN_PROCESS: 'false'
    volumes:
      # Master Archive — justera host-path (Mimers Brunn canonical)
      - ${IMPORT_ARCHIVE_HOST_PATH:-./storage}:/data/geo_master:ro
      - uploads_prod:/app/storage/uploads
    networks:
      - prod-net
      - geodata-net

  db:
    build:
      context: ./docker/postgres-prod
      dockerfile: Dockerfile
    image: miljobeslut-postgres-prod:15
    container_name: miljobeslut-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: miljobeslut
      POSTGRES_PASSWORD: password
      POSTGRES_DB: miljobeslut_prod
    ports:
      - '5434:5432'
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
      - ./backups/prod:/backups
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U miljobeslut -d miljobeslut_prod']
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - prod-net

volumes:
  pgdata_prod:
  uploads_prod:

networks:
  prod-net:
    driver: bridge
  geodata-net:
    external: true
    name: miljobeslut-platform-recovery_miljobeslut-net
