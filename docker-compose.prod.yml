version: '3.9'

# Primär prod — egen server (dual-track A). Se docs/ops/local-prod-setup.md
# Canonical build: Dockerfile (PNRC I2). LEGACY_GCP: Dockerfile.gcp

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    image: miljobeslut-portal:latest
    container_name: miljobeslut-app
    restart: unless-stopped
    ports:
      - '8080:8080'
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: '8080'
      DATABASE_URL: postgresql://miljobeslut:miljobeslut@miljobeslut-postgres:5432/miljobeslut?sslmode=disable
      BACKUP_DIR: /app/storage/backups
      SEARCH_WORKER_ENABLED: 'true'
      GDPR_CRON_IN_PROCESS: 'true'
      # Primary prod may enable in-process workers; staging uses docker-compose.staging.yml
      START_WORKERS_IN_PROCESS: 'true'
    volumes:
      - ${IMPORT_ARCHIVE_HOST_PATH:-./storage}:/data/geo_master:ro
      - uploads_prod:/app/storage/uploads
      - mimers_cas_prod:/var/mimers/cas
    networks:
      - prod-net
      - geodata-net

  db:
    build:
      context: ./docker/postgres-prod
      dockerfile: Dockerfile
    image: miljobeslut-postgres-prod:15
    container_name: miljobeslut-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: miljobeslut
      POSTGRES_PASSWORD: password
      POSTGRES_DB: miljobeslut_prod
    ports:
      - '5434:5432'
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
      - ./backups/prod:/backups
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U miljobeslut -d miljobeslut_prod']
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - prod-net

volumes:
  pgdata_prod:
  uploads_prod:
  mimers_cas_prod:

networks:
  prod-net:
    driver: bridge
  geodata-net:
    external: true
    name: miljobeslut-platform-recovery_miljobeslut-net
