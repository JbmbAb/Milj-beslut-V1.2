version: '3.8'

services:
  app:
    build:
      context: .
      target: production
    image: miljobeslut-portal:latest
    container_name: miljobeslut-app
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://miljobeslut:password@db:5432/miljobeslut_prod
      # Resten av miljövariablerna (.env) bör kopplas in via env_file eller direkt
    env_file:
      - .env.production
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgis/postgis:15-3.3
    container_name: miljobeslut-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=miljobeslut
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=miljobeslut_prod
    ports:
      - '5432:5432'
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U miljobeslut -d miljobeslut_prod']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata_prod:
