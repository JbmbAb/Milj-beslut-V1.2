# ────────────────────────────────────────────────────────────
#  GitLab CI/CD  –  Milj-beslut-V1.2
#  Mirrors the structure of .github/workflows/ci.yml
# ────────────────────────────────────────────────────────────

stages:
  - validate
  - test
  - build
  - e2e

variables:
  NODE_VERSION: "22"
  FF_NETWORK_PER_BUILD: "true"

# ── Shared setup anchor ───────────────────────────────────────
.node-setup: &node-setup
  image: node:${NODE_VERSION}
  before_script:
    - npm ci

# ── 1. Validate (parallel) ────────────────────────────────────
typecheck:
  stage: validate
  <<: *node-setup
  script:
    - npm run typecheck

lint:
  stage: validate
  <<: *node-setup
  script:
    - npm run lint

format:
  stage: validate
  <<: *node-setup
  script:
    - npm run format:check

# ── 2. Unit tests (no database) ───────────────────────────────
unit-tests:
  stage: test
  <<: *node-setup
  variables:
    NODE_ENV: test
    JWT_ACCESS_SECRET: ci-access-secret
    JWT_REFRESH_SECRET: ci-refresh-secret
    ADMIN_CONSOLE_USERNAME: admin
    ADMIN_CONSOLE_PASSWORD: admin-test-password
    ADMIN_ORG_NAME: "Miljobeslut Test Org"
    ADMIN_ORG_NUMBER: "999999-0001"
    LANTMATERIET_OPEN_MODE: "true"
    LANTMATERIET_BASE_URL: https://example.invalid
    SLU_API_BASE_URL: https://example.invalid
    SLU_API_KEY: ci-slu-key
    SEARCH_WORKER_ENABLED: "false"
    DATABASE_URL: postgresql://riskguard:password@localhost:5432/riskguard_test
  script:
    - cp .env.test.example .env.test
    - npm run test:unit
  coverage: '/Lines\s*:\s*(\d+\.?\d*)%/'
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
    paths:
      - coverage/
    expire_in: 7 days

# ── 3. Integration tests (PostgreSQL + PostGIS + pgvector) ────
integration-tests:
  stage: test
  <<: *node-setup
  services:
    - name: ghcr.io/jbmbab/milj-beslut-postgres-test:16
      alias: postgres
      variables:
        POSTGRES_DB: riskguard_test
        POSTGRES_USER: riskguard
        POSTGRES_PASSWORD: password
  variables:
    NODE_ENV: test
    DATABASE_URL: postgresql://riskguard:password@postgres:5432/riskguard_test
    JWT_ACCESS_SECRET: ci-access-secret
    JWT_REFRESH_SECRET: ci-refresh-secret
    ADMIN_CONSOLE_USERNAME: admin
    ADMIN_CONSOLE_PASSWORD: admin-test-password
    ADMIN_ORG_NAME: "Miljobeslut Test Org"
    ADMIN_ORG_NUMBER: "999999-0001"
    LANTMATERIET_OPEN_MODE: "true"
    LANTMATERIET_BASE_URL: https://example.invalid
    SLU_API_BASE_URL: https://example.invalid
    SLU_API_KEY: ci-slu-key
    SEARCH_WORKER_ENABLED: "false"
    DATABASE_INTEGRATION: "true"
  script:
    - cp .env.test.example .env.test
    - apt-get update -qq && apt-get install -y postgresql-client
    - npm run db:test:migrate
    - npm run db:test:seed
    - npm run test:integration

# ── 4. Build frontend ─────────────────────────────────────────
build:
  stage: build
  <<: *node-setup
  needs: [typecheck, lint, format]
  script:
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 day

# ── 5. E2E tests (Playwright + Chromium) ─────────────────────
e2e-tests:
  stage: e2e
  image: mcr.microsoft.com/playwright:v1.50.0-noble
  needs: [build, integration-tests]
  services:
    - name: ghcr.io/jbmbab/milj-beslut-postgres-test:16
      alias: postgres
      variables:
        POSTGRES_DB: riskguard_test
        POSTGRES_USER: riskguard
        POSTGRES_PASSWORD: password
  variables:
    NODE_ENV: test
    DATABASE_URL: postgresql://riskguard:password@postgres:5432/riskguard_test
    JWT_ACCESS_SECRET: ci-access-secret
    JWT_REFRESH_SECRET: ci-refresh-secret
    ADMIN_CONSOLE_USERNAME: admin
    ADMIN_CONSOLE_PASSWORD: admin-test-password
    ADMIN_ORG_NAME: "Miljobeslut Test Org"
    ADMIN_ORG_NUMBER: "999999-0001"
    LANTMATERIET_OPEN_MODE: "true"
    LANTMATERIET_BASE_URL: https://example.invalid
    SLU_API_BASE_URL: https://example.invalid
    SLU_API_KEY: ci-slu-key
    SEARCH_WORKER_ENABLED: "false"
    HOME: /root
  before_script:
    - npm ci
  script:
    - cp .env.test.example .env.test
    - apt-get update -qq && apt-get install -y postgresql-client
    - npm run db:test:migrate
    - npm run db:test:seed
    - npm run test:e2e
  artifacts:
    when: always
    paths:
      - playwright-report/
      - test-results/
    expire_in: 7 days
