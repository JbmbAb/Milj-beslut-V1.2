
<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miljöbeslut.se 2.0</title>
    <meta name="description" content="Sveriges ledande plattform för automatiserade miljötillstånd, MKB-underlag och marknadsanalys.">
    <link rel="manifest" href="/manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Miljöbeslut">
    <meta name="theme-color" content="#2563eb">
    
    <!-- Tailwind, FontAwesome & Leaflet bundled via Vite — no CDN needed -->
    
    <link rel="stylesheet" href="/tokens.css">
    <link rel="stylesheet" href="/design-system.css">
    <style>
        /* Google Fonts with local system-font fallback */
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        
        :root {
            --primary: var(--color-primary-500, #2563eb);
            --success: #10b981;
            --dark: #0f172a;
        }

        body {
            font-family: var(--typography-body-md-font-family, 'Plus Jakarta Sans', ui-sans-serif, system-ui, -apple-system, sans-serif);
            background-color: #f8fafc;
            color: var(--dark);
        }

        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #cbd5e1; }

        .leaflet-container { width: 100%; height: 100%; border-radius: 1rem; z-index: 1; }
        
        .portal-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(226, 232, 240, 0.8);
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
    </style>

<link rel="stylesheet" href="/index.css">
</head>
<body>
    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
