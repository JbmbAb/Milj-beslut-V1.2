<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Miljobeslut.se 2.0</title>
    <meta
      name="description"
      content="Sveriges ledande plattform för automatiserade miljötillstånd, MKB-underlag och marknadsanalys."
    />
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Miljöbeslut" />
    <meta name="theme-color" content="#2563eb" />

    <!-- Tailwind, FontAwesome & Leaflet bundled via Vite — no CDN needed -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    
    <!-- Plus Jakarta Sans from Google Fonts (optional — system fonts are the fallback) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
      media="print"
      onload="this.media = 'all'"
    />
    <style>
      :root {
        --primary: #6366f1;
        --success: #10b981;
        --dark: #020617;
      }

      body {
        font-family: 'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif;
        background-color: #020617;
        color: #f8fafc;
        margin: 0;
      }

      .custom-scrollbar::-webkit-scrollbar {
        width: 6px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: transparent;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #e2e8f0;
        border-radius: 10px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: #cbd5e1;
      }

      .leaflet-container {
        width: 100%;
        height: 100%;
        border-radius: 1rem;
        z-index: 1;
      }

      .portal-card {
        background: rgba(255, 255, 255, 0.8);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(226, 232, 240, 0.8);
      }

      @keyframes float {
        0% {
          transform: translateY(0px);
        }
        50% {
          transform: translateY(-10px);
        }
        100% {
          transform: translateY(0px);
        }
      }
    </style>

    <link rel="stylesheet" href="/src/index.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
        // Self-cleaning block for localhost developers to clear any stale Service Worker or Caches
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then((registrations) => {
            let unregisteredAny = false;
            for (const registration of registrations) {
              registration.unregister();
              unregisteredAny = true;
              console.log('[Dev Cleanup] Unregistered Service Worker:', registration);
            }
            if (unregisteredAny) {
              console.log('[Dev Cleanup] Service Worker unregistered on localhost.');
            }
          });
        }
        if ('caches' in window) {
          caches.keys().then((keys) => {
            let deletedAny = false;
            for (const key of keys) {
              caches.delete(key);
              deletedAny = true;
              console.log('[Dev Cleanup] Deleted cache:', key);
            }
            if (deletedAny) {
              console.log('[Dev Cleanup] Caches cleared. Reloading page...');
              window.location.reload();
            }
          });
        }
      } else if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
