<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <title>CESIUM-BROWSER-WEBGL-PROOF</title>
    <style>
      html, body, #cesiumContainer { width: 100%; height: 100%; margin: 0; background: #0b1220; }
      #report {
        position: absolute; z-index: 10; left: 12px; top: 12px; max-width: 420px;
        background: rgba(15, 23, 42, 0.92); color: #e2e8f0; font: 12px/1.4 ui-monospace, monospace;
        padding: 12px; border: 1px solid #334155; border-radius: 8px; white-space: pre-wrap;
      }
    </style>
    <link rel="stylesheet" href="/cesium/Widgets/widgets.css" />
  </head>
  <body>
    <div id="report">booting…</div>
    <div id="cesiumContainer" data-testid="cesium-proof-container"></div>
    <script src="/cesium/Cesium.js"></script>
    <script>
      window.__CESIUM_PROOF__ = { status: 'booting', checks: {} };
      function set(k, v) { window.__CESIUM_PROOF__.checks[k] = v; render(); }
      function render() {
        document.getElementById('report').textContent = JSON.stringify(window.__CESIUM_PROOF__, null, 2);
      }
      function fail(err) {
        window.__CESIUM_PROOF__.status = 'error';
        window.__CESIUM_PROOF__.error = String(err && err.message || err);
        render();
      }
      (async function main() {
        try {
          window.CESIUM_BASE_URL = '/cesium/';
          Cesium.Ion.defaultAccessToken = '';
          const canvasProbe = document.createElement('canvas');
          const gl = canvasProbe.getContext('webgl2') || canvasProbe.getContext('webgl');
          set('webgl', Boolean(gl));
          if (!gl) throw new Error('WebGL unavailable');

          const viewer = new Cesium.Viewer('cesiumContainer', {
            animation: false, timeline: false, baseLayerPicker: false, geocoder: false,
            homeButton: false, sceneModePicker: false, navigationHelpButton: false,
            fullscreenButton: false, infoBox: false, baseLayer: false,
            terrainProvider: new Cesium.EllipsoidTerrainProvider(),
          });
          set('viewer_boot', true);
          set('local_base_url', window.CESIUM_BASE_URL === '/cesium/');
          set('ion_token_unset', !Cesium.Ion.defaultAccessToken);

          const imagery = new Cesium.UrlTemplateImageryProvider({
            url: '/cesium/fixtures/imagery/orthophoto/{z}/{x}/{y}.png',
            maximumLevel: 2,
            credit: 'fixture orthophoto',
          });
          viewer.imageryLayers.addImageryProvider(imagery);
          set('imagery_fixture', true);

          // F-003: real local terrain provider path (CustomHeightmap), not ellipsoid-labelled-as-fixture.
          const width = 16;
          const height = 16;
          viewer.terrainProvider = new Cesium.CustomHeightmapTerrainProvider({
            width: width,
            height: height,
            callback: function () {
              return new Float32Array(width * height);
            },
          });
          set('terrain_fixture_provider', !(viewer.terrainProvider instanceof Cesium.EllipsoidTerrainProvider));
          set('terrain_provider_kind', viewer.terrainProvider.constructor && viewer.terrainProvider.constructor.name);

          // F-002: fail-closed tileset proof — must load renderable glTF content.
          const tileset = await Cesium.Cesium3DTileset.fromUrl(
            '/cesium/fixtures/tilesets/buildings/tileset.json',
            { maximumScreenSpaceError: 1, cullWithChildrenBounds: false },
          );
          if (!tileset.root || !tileset.root._contentHeader || !tileset.root._contentHeader.uri) {
            throw new Error('tileset root missing content.uri in header');
          }
          set('tileset_content_uri', tileset.root._contentHeader.uri);
          viewer.scene.primitives.add(tileset);
          viewer.camera.viewBoundingSphere(
            tileset.boundingSphere,
            new Cesium.HeadingPitchRange(0, -0.5, tileset.boundingSphere.radius * 2),
          );
          const deadline = Date.now() + 30000;
          while (Date.now() < deadline) {
            viewer.scene.render();
            if (tileset.root.contentFailed) {
              throw new Error('tileset content failed to load');
            }
            if (tileset.root.contentReady && tileset.root.contentAvailable) {
              break;
            }
            await new Promise(function (r) { setTimeout(r, 50); });
          }
          if (!(tileset.root.contentReady && tileset.root.contentAvailable)) {
            throw new Error('tileset content did not become ready/available');
          }
          await viewer.flyTo(tileset);
          set('tileset_content_ready', true);
          set('tileset_content_available', true);
          set('tileset_client', true);
          viewer.scene.primitives.remove(tileset);
          tileset.destroy();
          set('tileset_unload', true);

          const workerProbe = await fetch('/cesium/Workers/transferTypedArrayTest.js', { method: 'HEAD' });
          set('local_workers', workerProbe.ok);

          if (!window.__CESIUM_PROOF__.checks.tileset_client) {
            throw new Error('tileset_client check missing');
          }
          if (!window.__CESIUM_PROOF__.checks.terrain_fixture_provider) {
            throw new Error('terrain fixture provider must be non-ellipsoid');
          }

          window.__CESIUM_PROOF__.status = 'ready';
          window.__CESIUM_PROOF__.viewer = true;
          render();
          window.__CESIUM_PROOF_VIEWER__ = viewer;
        } catch (err) {
          fail(err);
        }
      })();
    </script>
  </body>
</html>
