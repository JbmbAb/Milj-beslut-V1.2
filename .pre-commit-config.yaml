# Pre-commit hooks for Python quality gates (prompt optimizer + scripts).
# Install: pip install pre-commit && pre-commit install
# Run all: pre-commit run --all-files

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=5120']

  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        language_version: python3.10
        files: ^(prompt_optimizer/|scripts/(vertex_prompt_optimize|ci_validate_results|generate_golden_dataset|update_pipeline_prompt)\.py)

  - repo: https://github.com/pycqa/flake8
    rev: 7.1.1
    hooks:
      - id: flake8
        files: ^(prompt_optimizer/|scripts/(vertex_prompt_optimize|ci_validate_results|generate_golden_dataset|update_pipeline_prompt)\.py)
        args: ['--config=.flake8']

  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.0
    hooks:
      - id: bandit
        files: ^prompt_optimizer/
        args: ['-ll', '-q']
