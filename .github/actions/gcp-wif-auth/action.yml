name: GCP Workload Identity Federation
description: Authenticate GitHub Actions to GCP without JSON service account keys.

inputs:
  workload_identity_provider:
    description: Full WIF provider resource name
    required: true
  service_account:
    description: Target GCP service account email
    required: true

runs:
  using: composite
  steps:
    - name: Authenticate to Google Cloud (WIF)
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ inputs.workload_identity_provider }}
        service_account: ${{ inputs.service_account }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2
