name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ─── Shared configuration ───────────────────────────────────────────────────

# Environment variables that do not require a live database (used in jobs
# that only do static analysis / build).
env:
  NODE_VERSION: '22'
  # Centralize the database connection string to avoid repetition and simplify updates.
  DATABASE_URL: postgresql://riskguard:password@localhost:5432/riskguard_test?sslmode=disable

# ─── Jobs ────────────────────────────────────────────────────────────────────

jobs:
  # ── 1. Static analysis – runs without a database ─────────────────────────
  typecheck:
    name: Typecheck
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  lint:
    name: Lint
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint

  format:
    name: Format check
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run format:check

  audit:
    name: Security audit
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm audit --fail-on=high

  # ── 2. Unit tests – no database needed ───────────────────────────────────
  test-unit:
    # This job now depends on the fastest static checks to fail early.
    name: Unit tests
    runs-on: ubuntu-latest
    needs: [typecheck, lint, format, audit]
    permissions:
      contents: read
    env:
      NODE_ENV: test
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
      ADMIN_CONSOLE_USERNAME: admin
      ADMIN_CONSOLE_PASSWORD: admin-test-password
      ADMIN_ORG_NAME: Miljobeslut Test Org
      ADMIN_ORG_NUMBER: 999999-0001
      LANTMATERIET_OPEN_MODE: 'true'
      LANTMATERIET_BASE_URL: https://example.invalid
      SLU_API_BASE_URL: https://example.invalid
      SLU_API_KEY: ci-slu-key
      SEARCH_WORKER_ENABLED: 'false' # Already defined in env
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: cp .env.test.example .env.test
      - name: Unit tests
        run: npm run test:unit
      - name: MPS infra gates (Frozen Core + Mimers + tickets + LU cutover + replay)
        run: >
          npx vitest run --config vitest.config.ts
          packages/mps-compliance/src/unit/FrozenCoreGoldenHash.test.ts
          packages/mps-compliance/tests/GoldenVector.test.ts
          packages/mps-runtime/src/unit/MimersCasRepository.test.ts
          packages/mps-runtime/src/unit/NoParallelCasPath.test.ts
          packages/mps-runtime/src/unit/ExecutionKernel.test.ts
          packages/mps-runtime/src/unit/mps-end-to-end-determinism.test.ts
          packages/mps-control-plane/src/unit/DurableTicketQueue.adversarial.test.ts
          packages/mps-lu/tests/LuExecutionKernelClient.test.ts
          packages/mps-lu/tests/LUMagicMoment.test.ts
          packages/mps-lu/src/unit/LuRuntimeFreeze.test.ts
          src/infrastructure/unit/PrismaExecutionTicketQueue.test.ts
          src/application/unit/resolve-execution-ticket-queue.test.ts
          src/application/unit/LuCutoverSinglePath.test.ts
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage
          if-no-files-found: ignore

  # ── 3. Integration tests – requires PostgreSQL + PostGIS + pgvector ───────
  test-integration:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: [typecheck, lint, format, audit]
    permissions:
      contents: read
    services:
      postgres:
        # Custom image providing PostgreSQL 16 with both PostGIS 3.4 and
        # pgvector so that all extensions used by the project are available.
        # See docker/postgres-test/Dockerfile for the build definition.
        image: ghcr.io/jbmbab/milj-beslut-postgres-test:16
        env:
          POSTGRES_DB: riskguard_test
          POSTGRES_USER: riskguard
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U riskguard -d riskguard_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15
    env:
      NODE_ENV: test
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
      ADMIN_CONSOLE_USERNAME: admin
      ADMIN_CONSOLE_PASSWORD: admin-test-password
      ADMIN_ORG_NAME: Miljobeslut Test Org
      ADMIN_ORG_NUMBER: 999999-0001
      LANTMATERIET_OPEN_MODE: 'true'
      LANTMATERIET_BASE_URL: https://example.invalid
      SLU_API_BASE_URL: https://example.invalid
      SLU_API_KEY: ci-slu-key
      SEARCH_WORKER_ENABLED: 'false'
      DATABASE_INTEGRATION: 'true'
      VERTEX_PROJECT_ID: miljointelligens
      GEMINI_API_KEY: ci-gemini-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: cp .env.test.example .env.test
      - name: Enable PostGIS + pgvector extensions
        run: |
          PGPASSWORD=password psql -h localhost -U riskguard -d riskguard_test \
            -c "CREATE EXTENSION IF NOT EXISTS postgis;" \
            -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;" \
            -c "CREATE EXTENSION IF NOT EXISTS unaccent;" \
            -c "CREATE EXTENSION IF NOT EXISTS vector;"
      - name: Migrate + seed
        run: |
          npm run db:test:migrate
          npm run db:test:seed
      - name: Integration tests
        run: npm run test:integration

  # ── 4. Build – depends on static analysis ────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test-unit, test-integration]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          if-no-files-found: error

  # ── 5. E2E – depends on build + integration (DB seeded) ──────────────────
  test-e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: read
    services:
      postgres:
        image: ghcr.io/jbmbab/milj-beslut-postgres-test:16
        env:
          POSTGRES_DB: riskguard_test
          POSTGRES_USER: riskguard
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U riskguard -d riskguard_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15
    env:
      NODE_ENV: test
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
      ADMIN_CONSOLE_USERNAME: admin
      ADMIN_CONSOLE_PASSWORD: admin-test-password
      ADMIN_ORG_NAME: Miljobeslut Test Org
      ADMIN_ORG_NUMBER: 999999-0001
      LANTMATERIET_OPEN_MODE: 'true'
      LANTMATERIET_BASE_URL: https://example.invalid
      SLU_API_BASE_URL: https://example.invalid
      SLU_API_KEY: ci-slu-key
      SEARCH_WORKER_ENABLED: 'false'
      DISPATCH_PROVIDER_MODE: 'MOCK_FRAKTBORS'
      VERTEX_PROJECT_ID: miljointelligens
      GEMINI_API_KEY: ci-gemini-key
      EXEC_SUMMARY_MOCK_MODE: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: cp .env.test.example .env.test
      - name: Enable PostGIS + pgvector extensions
        run: |
          PGPASSWORD=password psql -h localhost -U riskguard -d riskguard_test \
            -c "CREATE EXTENSION IF NOT EXISTS postgis;" \
            -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;" \
            -c "CREATE EXTENSION IF NOT EXISTS unaccent;" \
            -c "CREATE EXTENSION IF NOT EXISTS vector;"
      - name: Migrate + seed
        run: |
          npm run db:test:migrate
          npm run db:test:seed
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: E2E tests
        run: npm run test:e2e
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
