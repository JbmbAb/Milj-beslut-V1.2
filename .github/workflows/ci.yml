name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: riskguard_test
          POSTGRES_USER: riskguard
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U riskguard -d riskguard_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://riskguard:password@localhost:5432/riskguard_test
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
      ADMIN_CONSOLE_USERNAME: admin
      ADMIN_CONSOLE_PASSWORD: admin-test-password
      ADMIN_ORG_NAME: Miljobeslut Test Org
      ADMIN_ORG_NUMBER: 999999-0001
      LANTMATERIET_OPEN_MODE: 'true'
      LANTMATERIET_BASE_URL: https://example.invalid
      SLU_API_BASE_URL: https://example.invalid
      SLU_API_KEY: ci-slu-key
      SEARCH_WORKER_ENABLED: 'false'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare test env file
        run: cp .env.test.example .env.test

      - name: Prisma migrate + seed
        run: |
          npm run db:test:migrate
          npm run db:test:seed

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests
        run: npm run test:integration

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage
          if-no-files-found: ignore

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
