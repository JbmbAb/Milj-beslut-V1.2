# .github/workflows/vertex_prompt_optimize.yml
name: Vertex Prompt Optimizer

on:
  workflow_dispatch:
    inputs:
      run_vertex_job:
        description: 'Submit Vertex Custom Job (requires GCP_SA_KEY)'
        type: boolean
        default: false
      max_records:
        description: 'Golden records to evaluate (0 = all)'
        type: string
        default: '50'
  push:
    branches: [main]
    paths:
      - 'prompt_optimizer/**'
      - 'scripts/vertex_prompt_optimize.py'
      - 'scripts/ci_validate_results.py'
      - '.github/workflows/vertex_prompt_optimize.yml'
  pull_request:
    paths:
      - 'prompt_optimizer/**'
      - 'scripts/vertex_prompt_optimize.py'
      - 'scripts/ci_validate_results.py'
      - 'scripts/verify_prompt_results.sh'
      - '.github/workflows/vertex_prompt_optimize.yml'
      - '.pre-commit-config.yaml'

permissions:
  contents: read

env:
  PROJECT_ID: miljointelligens
  REGION: europe-west1
  BUCKET: miljobeslut-prompt-optimization-bucket
  GOOGLE_CLOUD_PROJECT: miljointelligens

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r prompt_optimizer/requirements.txt
          pip install -r prompt_optimizer/requirements-dev.txt
          pip install google-cloud-aiplatform

      - name: Run prompt optimizer unit tests with coverage
        working-directory: prompt_optimizer
        run: |
          python -m pytest tests/ -v --cov=. --cov-report=term-missing \
            --cov-fail-under=70 \
            --cov-config=.coveragerc

  lint-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install black flake8 bandit
      - run: black --check prompt_optimizer scripts/vertex_prompt_optimize.py scripts/ci_validate_results.py
      - run: flake8 prompt_optimizer scripts/vertex_prompt_optimize.py scripts/ci_validate_results.py
      - run: bandit -r prompt_optimizer -ll -q

  local-eval-smoke:
    runs-on: ubuntu-latest
    needs: [unit-tests, lint-python]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r prompt_optimizer/requirements.txt

      - name: Mock eval against golden sample
        env:
          MOCK_RERANK: '1'
          EVAL_SEED: '42'
          BOOTSTRAP_SAMPLES: '100'
        run: |
          cd prompt_optimizer
          python main.py \
            --input_data_path ../benchmarks/golden_v1_2000_records.jsonl \
            --output_data_path ./out \
            --max_iterations 2 \
            --max_records ${{ github.event.inputs.max_records || '20' }} \
            --cache_path ./out/eval_cache.sqlite

      - name: Verify results quality gates
        run: |
          python scripts/ci_validate_results.py prompt_optimizer/out/results_summary.json

  build-and-push:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: local-eval-smoke
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push container
        run: |
          gcloud builds submit prompt_optimizer \
            --tag gcr.io/${{ env.PROJECT_ID }}/prompt-optimizer:${{ github.sha }} \
            --tag gcr.io/${{ env.PROJECT_ID }}/prompt-optimizer:latest \
            --project ${{ env.PROJECT_ID }}

  vertex-job:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_vertex_job == 'true'
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Submit Vertex Custom Job
        id: submit
        env:
          MAX_RECORDS: ${{ github.event.inputs.max_records || '50' }}
        run: |
          IMAGE=gcr.io/${{ env.PROJECT_ID }}/prompt-optimizer:${{ github.sha }}
          OUTPUT_PREFIX=gs://${{ env.BUCKET }}/alphaevolve/list_deduplication/prompt_opt_results/${{ github.sha }}
          JOB=$(gcloud ai custom-jobs create \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --display-name=prompt-opt-${{ github.sha }} \
            --worker-pool-spec=machine-type=n1-standard-4,replica-count=1,container-image-uri=${IMAGE},environment-variables=VERTEX_PROJECT_ID=${{ env.PROJECT_ID }},GOOGLE_CLOUD_PROJECT=${{ env.PROJECT_ID }},VERTEX_LOCATION=${{ env.REGION }} \
            --args=--input_data_path=gs://${{ env.BUCKET }}/alphaevolve/list_deduplication/golden_v1/golden_v1_2000_records.jsonl \
            --args=--output_data_path=${OUTPUT_PREFIX} \
            --args=--target_model=gemini-1.5-flash \
            --args=--max_iterations=4 \
            --args=--max_records=${MAX_RECORDS} \
            --format='value(name)')
          echo "job_name=${JOB}" >> "$GITHUB_OUTPUT"
          echo "output_prefix=${OUTPUT_PREFIX}" >> "$GITHUB_OUTPUT"

      - name: Wait for Vertex job
        env:
          JOB_NAME: ${{ steps.submit.outputs.job_name }}
        run: |
          for i in $(seq 1 60); do
            STATE=$(gcloud ai custom-jobs describe "${JOB_NAME}" \
              --region=${{ env.REGION }} \
              --project=${{ env.PROJECT_ID }} \
              --format='value(state)')
            echo "Poll ${i}: ${STATE}"
            case "${STATE}" in
              JOB_STATE_SUCCEEDED) exit 0 ;;
              JOB_STATE_FAILED|JOB_STATE_CANCELLED) exit 1 ;;
            esac
            sleep 30
          done
          echo "Timed out waiting for Vertex job"
          exit 1

      - name: Validate results in GCS
        run: |
          gsutil cp ${{ steps.submit.outputs.output_prefix }}/results_summary.json /tmp/results_summary.json
          python scripts/ci_validate_results.py /tmp/results_summary.json

      - name: Publish canonical prompt artifacts to bucket root
        run: |
          PREFIX=${{ steps.submit.outputs.output_prefix }}
          ROOT=gs://${{ env.BUCKET }}/alphaevolve/list_deduplication/prompt_opt_results
          gsutil cp "${PREFIX}/best_prompt.txt" "${ROOT}/best_prompt.txt"
          gsutil cp "${PREFIX}/manifest.json" "${ROOT}/manifest.json"
          gsutil cp "${PREFIX}/results_summary.json" "${ROOT}/results_summary.json"
          echo "Published ${PREFIX} -> ${ROOT}/"
