name: DEV-GOV-V0 Trusted Evidence Gate
run-name: DEV-GOV gate ${{ inputs.candidate_sha }} orchestration=${{ inputs.attestation_run_id }}

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact candidate SHA to verify
        required: true
        type: string
      unit_definition_path:
        description: Repository-relative DEV-GOV V1 unit definition path
        required: true
        type: string
      red_run_id:
        description: Trusted RED attestation workflow run (legacy/manual single-proof path)
        required: false
        type: string
      green_run_id:
        description: Trusted GREEN attestation workflow run (legacy/manual single-proof path)
        required: false
        type: string
      attestation_run_id:
        description: Parent orchestration run containing all RED/GREEN attestation artifacts
        required: false
        type: string
      controller_dispatch_binding:
        description: Opaque controller dispatch binding embedded verbatim in the signed gate verdict (required for orchestrated verdict emission; never interpreted by DEV-GOV)
        required: false
        type: string

permissions:
  actions: read
  contents: read
  id-token: write
  statuses: write

jobs:
  evidence-gate:
    name: Verify trusted execution for exact candidate SHA
    runs-on: ubuntu-latest
    environment: devgov-attestation
    steps:
      - name: Require protected default-branch controller
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DISPATCH_REF: ${{ github.ref }}
        run: |
          test "$DISPATCH_REF" = "refs/heads/$DEFAULT_BRANCH"

      - name: Mark exact candidate gate pending
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          test "${#CANDIDATE_SHA}" -eq 40
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$CANDIDATE_SHA" \
            -f state=pending \
            -f context='DEV-GOV-V0 / trusted-execution' \
            -f description='Trusted execution gate is running'

      - name: Checkout protected controller
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: controller
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact candidate without executing candidate code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact candidate and unit definition containment
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          UNIT_DEFINITION_PATH: ${{ inputs.unit_definition_path }}
        run: |
          test "$(git -C candidate rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git -C candidate status --porcelain)"
          candidate_root="$(realpath candidate)"
          definition="$(realpath "candidate/$UNIT_DEFINITION_PATH")"
          case "$definition" in
            "$candidate_root"/*) ;;
            *) echo "unit definition escapes candidate checkout" >&2; exit 4 ;;
          esac
          branch="$(node - "$definition" <<'NODE'
          const fs = require('node:fs');
          const value = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          process.stdout.write(value.branch);
          NODE
          )"
          git check-ref-format --branch "$branch"
          git -C candidate switch -c "$branch"

      - name: Inspect required proof cardinality
        id: proof_plan
        env:
          UNIT_DEFINITION_PATH: ${{ inputs.unit_definition_path }}
        run: |
          node - "candidate/$UNIT_DEFINITION_PATH" "$GITHUB_OUTPUT" <<'NODE'
          const fs = require('node:fs');
          const definition = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const red = Array.isArray(definition.required_red) ? definition.required_red.length : 0;
          const green = Array.isArray(definition.required_green) ? definition.required_green.length : 0;
          fs.appendFileSync(process.argv[3], `red_count=${red}\ngreen_count=${green}\n`);
          NODE

      - name: Validate attestation artifact source
        env:
          ATTESTATION_RUN_ID: ${{ inputs.attestation_run_id }}
          RED_RUN_ID: ${{ inputs.red_run_id }}
          GREEN_RUN_ID: ${{ inputs.green_run_id }}
        run: |
          set -euo pipefail
          if [ -n "$ATTESTATION_RUN_ID" ]; then
            test -z "$RED_RUN_ID"
            test -z "$GREEN_RUN_ID"
          else
            test -n "$RED_RUN_ID"
            test -n "$GREEN_RUN_ID"
          fi

      - name: Download all trusted RED attestations from orchestrated parent run
        if: inputs.attestation_run_id != '' && steps.proof_plan.outputs.red_count != '0'
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.attestation_run_id }}
          pattern: devgov-attestation-RED-*
          path: ${{ runner.temp }}/devgov-attestations/red

      - name: Download all trusted GREEN attestations from orchestrated parent run
        if: inputs.attestation_run_id != '' && steps.proof_plan.outputs.green_count != '0'
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.attestation_run_id }}
          pattern: devgov-attestation-GREEN-*
          path: ${{ runner.temp }}/devgov-attestations/green

      - name: Download trusted RED attestation from manual run
        if: inputs.attestation_run_id == ''
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.red_run_id }}
          pattern: devgov-attestation-RED-*
          path: ${{ runner.temp }}/devgov-attestations/red

      - name: Download trusted GREEN attestation from manual run
        if: inputs.attestation_run_id == ''
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.green_run_id }}
          pattern: devgov-attestation-GREEN-*
          path: ${{ runner.temp }}/devgov-attestations/green

      - name: Obtain protected gate identity
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          DEVGOV_VERIFIER_TRUST_POLICY_JSON: ${{ secrets.DEVGOV_VERIFIER_TRUST_POLICY_JSON }}
        run: |
          test -n "$DEVGOV_VERIFIER_TRUST_POLICY_JSON"
          policy_sha="$(printf '%s' "$DEVGOV_VERIFIER_TRUST_POLICY_JSON" | sha256sum | cut -d ' ' -f 1)"
          audience="devgov-v0-gate:$policy_sha:$CANDIDATE_SHA"
          encoded_audience="$(node -e "process.stdout.write(encodeURIComponent(process.argv[1]))" "$audience")"
          response="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=$encoded_audience")"
          token="$(node -e "process.stdout.write(JSON.parse(process.argv[1]).value)" "$response")"
          test -n "$token"
          echo "::add-mask::$token"
          echo "DEVGOV_GATE_OIDC_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Verify trusted execution attestations
        id: gate
        continue-on-error: true
        env:
          DEVGOV_VERIFIER_TRUST_POLICY_JSON: ${{ secrets.DEVGOV_VERIFIER_TRUST_POLICY_JSON }}
          DEVGOV_GATE_VERDICT_PRIVATE_KEY_PEM: ${{ secrets.DEVGOV_GATE_VERDICT_PRIVATE_KEY_PEM }}
          DEVGOV_GATE_VERDICT_ISSUER: ${{ vars.DEVGOV_GATE_VERDICT_ISSUER }}
          DEVGOV_GATE_VERDICT_KEY_ID: ${{ vars.DEVGOV_GATE_VERDICT_KEY_ID }}
          DEVGOV_CONTROLLER_SHA: ${{ github.sha }}
          DEVGOV_JOB_WORKFLOW_REF: ${{ job.workflow_ref }}
          DEVGOV_ATTESTATION_RUN_ID: ${{ inputs.attestation_run_id }}
          DEVGOV_CONTROLLER_DISPATCH_BINDING: ${{ inputs.controller_dispatch_binding }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          UNIT_DEFINITION_PATH: ${{ inputs.unit_definition_path }}
          EXPECTED_RED_COUNT: ${{ steps.proof_plan.outputs.red_count }}
          EXPECTED_GREEN_COUNT: ${{ steps.proof_plan.outputs.green_count }}
          GIT_ALLOW_PROTOCOL: https:ssh
        run: |
          set -euo pipefail
          export GITHUB_WORKFLOW_REF="$DEVGOV_JOB_WORKFLOW_REF"
          mkdir -p "$RUNNER_TEMP/devgov-attestations/red" "$RUNNER_TEMP/devgov-attestations/green"
          mapfile -t red < <(find "$RUNNER_TEMP/devgov-attestations/red" -type f -name '*.json' | sort)
          mapfile -t green < <(find "$RUNNER_TEMP/devgov-attestations/green" -type f -name '*.json' | sort)
          test "${#red[@]}" -eq "$EXPECTED_RED_COUNT"
          test "${#green[@]}" -eq "$EXPECTED_GREEN_COUNT"

          attestation_args=()
          for file in "${red[@]}" "${green[@]}"; do
            if [ -n "$file" ]; then
              attestation_args+=(--attestation "$file")
            fi
          done

          # Orchestrated gates emit the signed gate verdict; the legacy
          # single-proof path (no attestation_run_id) emits none.
          verdict_args=()
          if [ -n "$DEVGOV_ATTESTATION_RUN_ID" ]; then
            verdict_args+=(--verdict-output "$RUNNER_TEMP/devgov-gate-verdict/gate-verdict.json")
          fi

          node controller/scripts/devgov/devgov.mjs evidence-gate \
            --definition "candidate/$UNIT_DEFINITION_PATH" \
            --candidate-sha "$CANDIDATE_SHA" \
            --worktree candidate \
            "${attestation_args[@]}" \
            "${verdict_args[@]}"

      - name: Publish signed gate verdict artifact
        id: verdict
        if: steps.gate.outcome == 'success' && inputs.attestation_run_id != ''
        uses: actions/upload-artifact@v4
        with:
          name: devgov-gate-verdict-${{ inputs.candidate_sha }}-${{ inputs.attestation_run_id }}
          path: ${{ runner.temp }}/devgov-gate-verdict/gate-verdict.json
          if-no-files-found: error
          overwrite: false
          retention-days: 90

      - name: Publish exact candidate gate result
        if: always()
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          ATTESTATION_RUN_ID: ${{ inputs.attestation_run_id }}
          GATE_OUTCOME: ${{ steps.gate.outcome }}
          VERDICT_OUTCOME: ${{ steps.verdict.outcome }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # The commit status is telemetry. It may only report success after
          # the authoritative signed verdict has been created AND uploaded on
          # the orchestrated path; a passed gate with no published verdict is
          # reported as failure so observation can never outrun authority.
          state=failure
          description='Trusted execution gate denied or did not complete'
          if [ "$GATE_OUTCOME" = success ]; then
            if [ -n "$ATTESTATION_RUN_ID" ]; then
              if [ "$VERDICT_OUTCOME" = success ]; then
                state=success
                description='Trusted RED/GREEN verified and signed gate verdict published for exact candidate SHA'
              else
                description='Trusted execution gate passed but no authoritative gate verdict was published'
              fi
            else
              state=success
              description='Trusted RED/GREEN verified for exact candidate SHA'
            fi
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$CANDIDATE_SHA" \
            -f state="$state" \
            -f context='DEV-GOV-V0 / trusted-execution' \
            -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          test "$state" = success
