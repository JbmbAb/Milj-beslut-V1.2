name: Deploy – Google Cloud Run

# LEGACY_GCP — deprecated pilot deploy path. Canonical build/deploy: Dockerfile + dedicated-server stack (PNRC I2).
# Do not use for I2+ dedicated-server staging.
#
# Dual-track A (beslut 2026-07-27):
#   Lokal server = primär prod (Master Archive, PostGIS, domänlogik)
#   GCP = staging/pilot/demo (Vertex-smoke, CI-validering)
#
# Triggers:
#   - workflow_dispatch (manuell pilot-deploy)
#   - CI på staging-branch + STAGING_DEPLOY_ENABLED=true
# main/master triggar INTE GCP-deploy.
#
# Se docs/ops/dual-track-a.md och docs/ops/local-prod-setup.md

on:
  workflow_run:
    workflows: [CI]
    branches: [staging]
    types: [completed]
  workflow_dispatch:
    inputs:
      environment:
        description: Målmiljö (GCP pilot — inte primär prod)
        required: true
        default: staging
        type: choice
        options: [staging, production]
      release_ref:
        description: Immutable tag or pinned ref to deploy
        required: true
        type: string
      expected_sha:
        description: Expected commit SHA resolved by release_ref
        required: true
        type: string

concurrency:
  group: deploy-gcp-${{ github.event.inputs.environment || 'staging' }}
  cancel-in-progress: false

jobs:
  guard:
    name: Gate on CI success
    runs-on: ubuntu-latest
    permissions: {}
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - run: echo "CI passed – fortsätter med GCP pilot-deploy"

  deploy-gcp:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: guard
    # Manuell deploy alltid; auto endast staging-branch + gate.
    if: >
      github.event_name == 'workflow_dispatch' ||
      vars.STAGING_DEPLOY_ENABLED == 'true'
    permissions:
      contents: read
      id-token: write
      actions: write
    environment:
      name: ${{ github.event.inputs.environment || 'staging' }}
      url: ${{ vars.GCP_SERVICE_URL }}

    env:
      PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION || 'europe-west1' }}
      SERVICE: ${{ vars.GCP_SERVICE_NAME || 'miljobeslut' }}
      REPO: ${{ vars.GCP_ARTIFACT_REPO || 'miljobeslut' }}
      CLOUDSQL_INSTANCE: ${{ vars.GCP_CLOUDSQL_INSTANCE || secrets.GCP_CLOUDSQL_INSTANCE }}
      MIGRATE_JOB: ${{ vars.GCP_MIGRATE_JOB_NAME || 'miljobeslut-migrate' }}
      RUNTIME_SA: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT || 'mil-beslut' }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref || github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact staging ref
        shell: bash
        env:
          RELEASE_REF: ${{ inputs.release_ref || github.event.workflow_run.head_sha || github.sha }}
          EXPECTED_SHA: ${{ inputs.expected_sha || github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail

          if [ -z "$RELEASE_REF" ]; then
            echo "release_ref saknas."
            exit 1
          fi

          if [ -z "$EXPECTED_SHA" ]; then
            echo "expected_sha saknas."
            exit 1
          fi

          REF_MATCHES="$(git ls-remote --refs origin "$RELEASE_REF" "refs/heads/$RELEASE_REF" "refs/tags/$RELEASE_REF" | awk '{print $1}' | sort -u)"
          REF_MATCH_COUNT="$(printf '%s\n' "$REF_MATCHES" | sed '/^$/d' | wc -l | tr -d ' ')"

          if [ "$REF_MATCH_COUNT" != "1" ]; then
            echo "release_ref must resolve to exactly one remote ref; got $REF_MATCH_COUNT"
            printf '%s\n' "$REF_MATCHES"
            exit 1
          fi

          RESOLVED_REF_SHA="$REF_MATCHES"
          CHECKOUT_SHA="$(git rev-parse HEAD)"

          echo "EXPECTED_SHA=$EXPECTED_SHA"
          echo "RESOLVED_REF_SHA=$RESOLVED_REF_SHA"
          echo "CHECKOUT_SHA=$CHECKOUT_SHA"

          if [ "$RESOLVED_REF_SHA" != "$EXPECTED_SHA" ]; then
            echo "release_ref resolves to $RESOLVED_REF_SHA, expected $EXPECTED_SHA"
            exit 1
          fi

          if [ "$CHECKOUT_SHA" != "$EXPECTED_SHA" ]; then
            echo "checkout HEAD is $CHECKOUT_SHA, expected $EXPECTED_SHA"
            exit 1
          fi

          {
            echo "RELEASE_REF=$RELEASE_REF"
            echo "EXPECTED_SHA=$EXPECTED_SHA"
            echo "RESOLVED_REF_SHA=$RESOLVED_REF_SHA"
            echo "CHECKOUT_SHA=$CHECKOUT_SHA"
          } >> "$GITHUB_ENV"

          {
            echo "## Exact SHA staging identity"
            echo ""
            echo "- Release ref: $RELEASE_REF"
            echo "- Expected SHA: $EXPECTED_SHA"
            echo "- Resolved ref SHA: $RESOLVED_REF_SHA"
            echo "- Checkout SHA: $CHECKOUT_SHA"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build Docker image
        run: |
          docker build \
            -f Dockerfile.gcp \
            --target production \
            --build-arg CACHEBUST="${CHECKOUT_SHA}" \
            --tag ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/${{ env.SERVICE }}:${CHECKOUT_SHA} \
            --tag ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/${{ env.SERVICE }}:latest \
            .

      - name: Push to Artifact Registry
        run: |
          docker push --all-tags \
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/${{ env.SERVICE }}

      - name: Run Prisma migrate (Cloud Run Job)
        run: |
          set -euo pipefail

          if [ -z "$CLOUDSQL_INSTANCE" ]; then
            echo "GCP_CLOUDSQL_INSTANCE saknas."
            echo "Sätt repo variable: miljointelligens:europe-west1:miljobeslut-db"
            exit 1
          fi

          SA_EMAIL="${RUNTIME_SA}@${PROJECT_ID}.iam.gserviceaccount.com"
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPO}/${SERVICE}:${CHECKOUT_SHA}"
          MIGRATE_COMMAND='set -e; npx prisma migrate deploy && npx tsx scripts/db/spatial-bootstrap.ts'

          JOB_FLAGS=(
            --region="$REGION"
            --image="$IMAGE"
            --service-account="$SA_EMAIL"
            --command=/bin/sh
            --args=-c,"$MIGRATE_COMMAND"
            --set-cloudsql-instances="$CLOUDSQL_INSTANCE"
            --set-secrets=DATABASE_URL=DATABASE_URL:latest
            --quiet
          )

          if [ -n "${{ vars.GCP_VPC_CONNECTOR }}" ]; then
            JOB_FLAGS+=(--vpc-connector="${{ vars.GCP_VPC_CONNECTOR }}")
          fi

          if gcloud run jobs describe "$MIGRATE_JOB" --region="$REGION" &>/dev/null; then
            gcloud run jobs update "$MIGRATE_JOB" "${JOB_FLAGS[@]}"
          else
            gcloud run jobs create "$MIGRATE_JOB" "${JOB_FLAGS[@]}"
          fi

          gcloud run jobs execute "$MIGRATE_JOB" --region="$REGION" --wait

      - name: Deploy to Cloud Run
        id: deploy
        run: |
          SERVICE_URL=$(gcloud run deploy ${{ env.SERVICE }} \
            --image=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/${{ env.SERVICE }}:${CHECKOUT_SHA} \
            --region=${{ env.REGION }} \
            --platform=managed \
            --service-account=${{ env.RUNTIME_SA }}@${{ env.PROJECT_ID }}.iam.gserviceaccount.com \
            --add-cloudsql-instances=${{ env.CLOUDSQL_INSTANCE }} \
            --update-secrets="DATABASE_URL=DATABASE_URL:latest,JWT_ACCESS_SECRET=JWT_ACCESS_SECRET:latest,JWT_REFRESH_SECRET=JWT_REFRESH_SECRET:latest,GEMINI_API_KEY=GEMINI_API_KEY:latest,OPENAI_API_KEY=OPENAI_API_KEY:latest,SEARCH_ENCRYPTION_KEY_BASE64=SEARCH_ENCRYPTION_KEY_BASE64:latest,QUERY_HASH_SALT=QUERY_HASH_SALT:latest,ADMIN_CONSOLE_PASSWORD=ADMIN_CONSOLE_PASSWORD:latest,BANKID_PFX_PASSPHRASE=BANKID_PFX_PASSPHRASE:latest,BANKID_PFX_CONTENT=BANKID_PFX_CONTENT:latest,LANTMATERIET_API_KEY=LANTMATERIET_API_KEY:latest,LANTMATERIET_CONSUMER_KEY=LANTMATERIET_CONSUMER_KEY:latest,LANTMATERIET_CONSUMER_SECRET=LANTMATERIET_CONSUMER_SECRET:latest,LANTMATERIET_OPEN_SUBSCRIPTION_KEY=LANTMATERIET_OPEN_SUBSCRIPTION_KEY:latest,SLU_API_KEY=SLU_API_KEY:latest,TRAFIKVERKET_API_KEY=TRAFIKVERKET_API_KEY:latest,VISS_API_KEY=VISS_API_KEY:latest" \
            --set-env-vars="NODE_ENV=production,START_WORKERS_IN_PROCESS=false,ADMIN_CONSOLE_USERNAME=admin,LANTMATERIET_BASE_URL=https://api.lantmateriet.se/ogc-features/v1,LANTMATERIET_OPEN_MODE=true,SLU_API_BASE_URL=https://api.slu.se,CORS_ALLOW_ORIGINS=${{ vars.GCP_CORS_ORIGINS }},VERTEX_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }},VERTEX_LOCATION=${{ vars.GCP_REGION || 'europe-west1' }},QUERY_HASH_SALT_VERSION=v1,LEGAL_RERANKER=on,LEGAL_RERANKER_RELATIVE_GAP=0.15,GCS_DOCUMENTS_BUCKET=${{ vars.GCP_DOCUMENTS_BUCKET }},GCS_DOCUMENTS_PREFIX=documents" \
            --no-allow-unauthenticated \
            --format="value(status.url)")
          echo "DEPLOYED_SERVICE_URL=$SERVICE_URL" >> "$GITHUB_ENV"
          echo "DEPLOYED_SHA=${CHECKOUT_SHA}" >> "$GITHUB_ENV"
          echo "Cloud Run URL: $SERVICE_URL"
          echo "Deployed SHA: ${CHECKOUT_SHA}"

      - name: Get Cloud Run ID token
        id: cloud-run-id-token
        if: env.DEPLOYED_SERVICE_URL != '' || vars.GCP_SERVICE_URL != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ env.DEPLOYED_SERVICE_URL || vars.GCP_SERVICE_URL }}
          id_token_include_email: true

      - name: Health check
        if: steps.cloud-run-id-token.outcome == 'success'
        env:
          SERVICE_URL: ${{ env.DEPLOYED_SERVICE_URL || vars.GCP_SERVICE_URL }}
        run: |
          set -euo pipefail

          echo "Hälsokontroll mot $SERVICE_URL/health"
          TOKEN="${{ steps.cloud-run-id-token.outputs.id_token }}"

          for attempt in $(seq 1 12); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "Authorization: Bearer $TOKEN" \
              "$SERVICE_URL/health" || echo "000")

            if [ "$STATUS" = "200" ]; then
              echo "Hälsokontroll OK (HTTP $STATUS, försök $attempt)"
              READY_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
                -H "Authorization: Bearer $TOKEN" \
                "$SERVICE_URL/ready" || echo "000")
              if [ "$READY_STATUS" = "200" ]; then
                echo "Readiness OK (HTTP $READY_STATUS)"
              else
                echo "Varning: /ready HTTP $READY_STATUS (deploy fortsätter — /health OK)"
              fi
              exit 0
            fi

            echo "Försök $attempt/12: HTTP $STATUS – väntar 10s..."
            sleep 10
          done

          echo "Hälsokontroll misslyckades efter 12 försök (senaste HTTP $STATUS)"
          exit 1

      - name: Update GCP_SERVICE_URL variable
        if: success() && env.DEPLOYED_SERVICE_URL != ''
        continue-on-error: true
        run: gh variable set GCP_SERVICE_URL --body "$DEPLOYED_SERVICE_URL"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Rollback on failure
        if: failure() && steps.deploy.outcome == 'failure'
        run: |
          echo "Deploy misslyckades – rullar tillbaka till föregående revision..."
          PREV_REVISION=$(gcloud run revisions list \
            --service=${{ env.SERVICE }} \
            --region=${{ env.REGION }} \
            --limit=2 \
            --format="value(name)" | tail -1)

          if [ -z "$PREV_REVISION" ]; then
            echo "Ingen tidigare revision hittades – kan inte rulla tillbaka."
            exit 1
          fi

          gcloud run services update-traffic ${{ env.SERVICE }} \
            --region=${{ env.REGION }} \
            --to-revisions="${PREV_REVISION}=100"

          echo "Rollback till $PREV_REVISION slutförd."
