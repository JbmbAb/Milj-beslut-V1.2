name: Deploy – Google Cloud Run

on:
  workflow_run:
    workflows: [CI]
    branches: [main, master]
    types: [completed]
  workflow_dispatch:
    inputs:
      environment:
        description: Målmiljö
        required: true
        default: production
        type: choice
        options: [production, staging]

# Förhindra parallella deployments till samma miljö
concurrency:
  group: deploy-gcp-${{ github.event.inputs.environment || 'production' }}
  cancel-in-progress: false

jobs:
  # ── 1. Stoppa om CI inte gick igenom ──────────────────────────────────────
  guard:
    name: Gate on CI success
    runs-on: ubuntu-latest
    permissions: {}
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - run: echo "CI passed – fortsätter med GCP-deploy"

  # ── 2. Bygg, pusha och deploya ────────────────────────────────────────────
  deploy-gcp:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: guard
    permissions:
      contents: read
      id-token: write # Krävs för Workload Identity Federation
    environment:
      name: ${{ github.event.inputs.environment || 'production' }}
      url: ${{ vars.GCP_SERVICE_URL }}

    env:
      PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION || 'europe-west1' }}
      SERVICE: ${{ vars.GCP_SERVICE_NAME || 'miljobeslut' }}
      REPO: ${{ vars.GCP_ARTIFACT_REPO || 'miljobeslut' }}
      # Connection name: PROJECT:REGION:INSTANCE (repo variable eller secret)
      CLOUDSQL_INSTANCE: ${{ vars.GCP_CLOUDSQL_INSTANCE || secrets.GCP_CLOUDSQL_INSTANCE }}
      MIGRATE_JOB: ${{ vars.GCP_MIGRATE_JOB_NAME || 'miljobeslut-migrate' }}
      RUNTIME_SA: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT || 'mil-beslut' }}

    steps:
      - uses: actions/checkout@v4

      # ── Autentisera mot GCP via Workload Identity Federation ──────────────
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # ── Konfigurera Docker för Artifact Registry ──────────────────────────
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      # ── Bygg Docker-image ─────────────────────────────────────────────────
      - name: Build Docker image
        run: |
          docker build \
            -f Dockerfile.gcp \
            --target production \
            --build-arg CACHEBUST=${{ github.sha }} \
            --tag ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/${{ env.SERVICE }}:${{ github.sha }} \
            --tag ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/${{ env.SERVICE }}:latest \
            --cache-from ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/${{ env.SERVICE }}:latest \
            .

      # ── Pusha till Artifact Registry ──────────────────────────────────────
      - name: Push to Artifact Registry
        run: |
          docker push --all-tags \
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/${{ env.SERVICE }}

      # ── Kör Prisma migrate via Cloud Run Job (Cloud SQL socket + Secret Manager) ─
      # DATABASE_URL läses från GCP Secret Manager – ingen GitHub-secret behövs.
      - name: Run Prisma migrate (Cloud Run Job)
        run: |
          set -euo pipefail

          if [ -z "$CLOUDSQL_INSTANCE" ]; then
            echo "GCP_CLOUDSQL_INSTANCE saknas."
            echo "Sätt repo variable: miljointelligens:europe-west1:miljobeslut-db"
            exit 1
          fi

          SA_EMAIL="${RUNTIME_SA}@${PROJECT_ID}.iam.gserviceaccount.com"
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPO}/${SERVICE}:${{ github.sha }}"
          MIGRATE_COMMAND='set -e; npx prisma migrate deploy && npx tsx scripts/db/spatial-bootstrap.ts'

          JOB_FLAGS=(
            --region="$REGION"
            --image="$IMAGE"
            --service-account="$SA_EMAIL"
            --command=/bin/sh
            --args=-c,"$MIGRATE_COMMAND"
            --set-cloudsql-instances="$CLOUDSQL_INSTANCE"
            --set-secrets=DATABASE_URL=DATABASE_URL:latest
            --quiet
          )

          if [ -n "${{ vars.GCP_VPC_CONNECTOR }}" ]; then
            JOB_FLAGS+=(--vpc-connector="${{ vars.GCP_VPC_CONNECTOR }}")
          fi

          if gcloud run jobs describe "$MIGRATE_JOB" --region="$REGION" &>/dev/null; then
            gcloud run jobs update "$MIGRATE_JOB" "${JOB_FLAGS[@]}"
          else
            gcloud run jobs create "$MIGRATE_JOB" "${JOB_FLAGS[@]}"
          fi

          gcloud run jobs execute "$MIGRATE_JOB" --region="$REGION" --wait

      # ── Deploya till Cloud Run ────────────────────────────────────────────
      - name: Deploy to Cloud Run
        id: deploy
        run: |
          SERVICE_URL=$(gcloud run deploy ${{ env.SERVICE }} \
            --image=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/${{ env.SERVICE }}:${{ github.sha }} \
            --region=${{ env.REGION }} \
            --platform=managed \
            --service-account=${{ env.RUNTIME_SA }}@${{ env.PROJECT_ID }}.iam.gserviceaccount.com \
            --add-cloudsql-instances=${{ env.CLOUDSQL_INSTANCE }} \
            --update-secrets="DATABASE_URL=DATABASE_URL:latest,JWT_ACCESS_SECRET=JWT_ACCESS_SECRET:latest,JWT_REFRESH_SECRET=JWT_REFRESH_SECRET:latest,GEMINI_API_KEY=GEMINI_API_KEY:latest,OPENAI_API_KEY=OPENAI_API_KEY:latest,SEARCH_ENCRYPTION_KEY_BASE64=SEARCH_ENCRYPTION_KEY_BASE64:latest,ADMIN_CONSOLE_PASSWORD=ADMIN_CONSOLE_PASSWORD:latest,BANKID_PFX_PASSPHRASE=BANKID_PFX_PASSPHRASE:latest,BANKID_PFX_CONTENT=BANKID_PFX_CONTENT:latest,LANTMATERIET_API_KEY=LANTMATERIET_API_KEY:latest,LANTMATERIET_CONSUMER_KEY=LANTMATERIET_CONSUMER_KEY:latest,LANTMATERIET_CONSUMER_SECRET=LANTMATERIET_CONSUMER_SECRET:latest,LANTMATERIET_OPEN_SUBSCRIPTION_KEY=LANTMATERIET_OPEN_SUBSCRIPTION_KEY:latest,SLU_API_KEY=SLU_API_KEY:latest,TRAFIKVERKET_API_KEY=TRAFIKVERKET_API_KEY:latest,VISS_API_KEY=VISS_API_KEY:latest" \
            --set-env-vars="NODE_ENV=production,START_WORKERS_IN_PROCESS=false,LANTMATERIET_BASE_URL=https://api.lantmateriet.se/ogc-features/v1,LANTMATERIET_OPEN_MODE=true,SLU_API_BASE_URL=https://api.slu.se,CORS_ALLOW_ORIGINS=${{ vars.GCP_CORS_ORIGINS }},VERTEX_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }},VERTEX_LOCATION=${{ vars.GCP_REGION || 'europe-west1' }}" \
            --no-allow-unauthenticated \
            --format="value(status.url)")
          echo "DEPLOYED_SERVICE_URL=$SERVICE_URL" >> "$GITHUB_ENV"
          echo "Cloud Run URL: $SERVICE_URL"

      # ── Hälsokontroll ─────────────────────────────────────────────────────
      - name: Health check
        run: |
          SERVICE_URL="${{ vars.GCP_SERVICE_URL }}"
          if [ -z "$SERVICE_URL" ]; then
            SERVICE_URL="${DEPLOYED_SERVICE_URL:-}"
          fi
          if [ -z "$SERVICE_URL" ]; then
            echo "GCP_SERVICE_URL inte satt – hoppar över hälsokontroll."
            exit 0
          fi

          echo "Väntar på att tjänsten ska starta..."
          sleep 10

          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $(gcloud auth print-identity-token)" \
            "$SERVICE_URL/health")

          if [ "$STATUS" != "200" ]; then
            echo "Hälsokontroll misslyckades – HTTP $STATUS"
            exit 1
          fi

          echo "Hälsokontroll OK (HTTP $STATUS)"

      - name: Update GCP_SERVICE_URL variable
        if: success() && env.DEPLOYED_SERVICE_URL != ''
        run: gh variable set GCP_SERVICE_URL --body "$DEPLOYED_SERVICE_URL"
        env:
          GH_TOKEN: ${{ github.token }}

      # ── Rulla tillbaka om deploy misslyckas ───────────────────────────────
      - name: Rollback on failure
        if: failure() && steps.deploy.outcome == 'failure'
        run: |
          echo "Deploy misslyckades – rullar tillbaka till föregående revision..."
          PREV_REVISION=$(gcloud run revisions list \
            --service=${{ env.SERVICE }} \
            --region=${{ env.REGION }} \
            --limit=2 \
            --format="value(name)" | tail -1)

          if [ -z "$PREV_REVISION" ]; then
            echo "Ingen tidigare revision hittades – kan inte rulla tillbaka."
            exit 1
          fi

          gcloud run services update-traffic ${{ env.SERVICE }} \
            --region=${{ env.REGION }} \
            --to-revisions="${PREV_REVISION}=100"

          echo "Rollback till $PREV_REVISION slutförd."
