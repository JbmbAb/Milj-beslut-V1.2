name: Authority Promotion Dispatch C2

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch protected Dev-Gov orchestrator for exact C2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run devgov-v0-orchestrate.yml \
            --repo JbmbAb/Milj-beslut-V1.2 \
            --ref main \
            -f candidate_sha=41eea7eedbeeaf5d21935a1a0cd938bd31b9c56a \
            -f unit_definition_path=governance/devgov/units/authority-chain-promotion-01-v1.json
