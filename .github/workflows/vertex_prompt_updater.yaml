# .github/workflows/vertex_prompt_updater.yaml
name: Vertex AI Prompt Sync & Verification

on:
  workflow_dispatch:
    inputs:
      prompt_gcs_uri:
        description: 'The GCS URI of the optimized best_prompt.txt'
        required: true
        default: 'gs://miljobeslut-prompt-optimization-bucket/alphaevolve/list_deduplication/prompt_opt_results/best_prompt.txt'
  repository_dispatch:
    types: [vertex_job_completed]

permissions:
  contents: write
  id-token: write

jobs:
  sync-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - uses: ./.github/actions/gcp-wif-auth
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_VERTEX_SERVICE_ACCOUNT }}

      - name: Install Dependencies
        run: pip install google-cloud-storage

      - name: Run Update and Smoke Test
        env:
          PROMPT_URI: ${{ github.event.inputs.prompt_gcs_uri || github.event.client_payload.prompt_gcs_uri }}
        run: bash scripts/ci_update_and_smoke_test.sh "$PROMPT_URI"

      - name: Push Changes (disabled — human review required)
        if: false
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git push origin main || echo "No changes to push or branch protected."
