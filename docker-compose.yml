services:
  # ─── Applikation (Node.js / Remix) ──────────────────────────
  app:
    build:
      context: .
      target: web
    container_name: miljobeslut-app
    restart: unless-stopped
    ports:
      - '8787:8787'
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      # App-containern ska använda den lokala Postgres-instansen i Docker-nätverket.
      - DATABASE_URL=postgresql://miljobeslut:miljobeslut@db:5432/miljobeslut?sslmode=disable
    networks:
      - miljobeslut-net
    volumes:
      - type: bind
        source: H:\Delade enheter\Miljöbeslut\GEO_Master_Archive
        target: /master-archive

  # ─── PostgreSQL med PostGIS + pgvector ──────────────────────
  db:
    profiles:
      - docker-db
    build:
      context: .
      dockerfile: docker/postgres-dev/Dockerfile
    container_name: miljobeslut-postgres
    restart: unless-stopped
    shm_size: '2gb'
    command:
      - postgres
      - -c
      - shared_buffers=1GB
      - -c
      - effective_cache_size=12GB
      - -c
      - work_mem=32MB
      - -c
      - maintenance_work_mem=1GB
      - -c
      - effective_io_concurrency=64
      - -c
      - max_parallel_workers_per_gather=4
      - -c
      - random_page_cost=1.1
    environment:
      POSTGRES_DB: miljobeslut
      POSTGRES_USER: miljobeslut
      POSTGRES_PASSWORD: miljobeslut
    ports:
      - '5432:5432'
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse
    security_opt:
      - apparmor:unconfined
    volumes:
      - type: volume
        source: postgres-data
        target: /var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d/extra:ro
      - type: bind
        source: H:\Delade enheter\Miljöbeslut\GEO_Master_Archive
        target: /master-archive
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U miljobeslut -d miljobeslut']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - miljobeslut-net

  # ─── Isolerad testdatabas för Vitest/integrationstester ─────
  db-test:
    profiles:
      - test-db
    build:
      context: .
      dockerfile: docker/postgres-dev/Dockerfile
    container_name: miljobeslut-postgres-test
    restart: unless-stopped
    environment:
      POSTGRES_DB: miljobeslut_test
      POSTGRES_USER: miljobeslut
      POSTGRES_PASSWORD: miljobeslut
    ports:
      - '5433:5432' # Exponera på en annan port för att undvika konflikt
    networks:
      - miljobeslut-net

volumes:
  postgres-data:
    driver: local

networks:
  miljobeslut-net:
    driver: bridge
