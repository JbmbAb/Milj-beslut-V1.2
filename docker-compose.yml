version: '3.8'

services:
  postgres-test:
    # Använder exakt samma avbildning som i CI/CD för konsistens.
    image: ghcr.io/jbmbab/milj-beslut-postgres-test:16
    container_name: miljobeslut-postgres-test
    environment:
      # Samma credentials som används i ci.yml och playwright.config.ts
      POSTGRES_DB: riskguard_test
      POSTGRES_USER: riskguard
      POSTGRES_PASSWORD: password
    ports:
      # Mappar port 5432 i containern till 5432 på din lokala maskin.
      # Ändra den första siffran om du redan har en annan PostgreSQL-instans på den porten.
      - '5432:5432'
    volumes:
      # (Valfritt) Behåll datan mellan omstarter för snabbare testkörningar.
      # Ta bort denna sektion för att få en helt ny, fräsch databas varje gång.
      - postgres-test-data:/var/lib/postgresql/data

volumes:
  postgres-test-data:
